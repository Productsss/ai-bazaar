<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Bazaar - Digital Products</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

header{
  background:linear-gradient(135deg,#6c2cff,#00b8d9);
  color:white;
  padding:28px 18px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:34px;
}

header p{
  margin:8px 0 0;
}

nav{
  background:white;
  padding:12px;
  display:flex;
  gap:8px;
  justify-content:center;
  flex-wrap:wrap;
  position:sticky;
  top:0;
  z-index:10;
  box-shadow:0 2px 8px #ddd;
}

nav button{
  border:0;
  border-radius:20px;
  padding:10px 15px;
  cursor:pointer;
  background:#eee;
}

nav button.active,
nav button:hover{
  background:#6c2cff;
  color:white;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:20px;
}

.search{
  width:100%;
  padding:15px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:16px;
  margin-bottom:20px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:18px;
}

.card{
  background:white;
  border-radius:15px;
  padding:18px;
  box-shadow:0 3px 12px #ddd;
  transition:.2s;
}

.card:hover{
  transform:translateY(-3px);
}

.icon{
  font-size:42px;
}

.card h3{
  margin:8px 0;
}

.desc{
  color:#687386;
  font-size:14px;
  min-height:40px;
}

.price{
  font-size:20px;
  font-weight:bold;
  margin:12px 0;
  color:#6c2cff;
}

.rating{
  color:#f5a623;
}

.buy{
  width:100%;
  border:0;
  padding:12px;
  border-radius:10px;
  background:#6c2cff;
  color:white;
  font-size:15px;
  cursor:pointer;
}

.buy:hover{
  background:#4e19c7;
}

#cart{
  position:fixed;
  right:15px;
  bottom:15px;
  background:#111;
  color:white;
  padding:15px 20px;
  border-radius:30px;
  cursor:pointer;
  box-shadow:0 4px 15px #999;
  z-index:20;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#0009;
  align-items:center;
  justify-content:center;
  z-index:30;
}

.modal-box{
  background:white;
  width:92%;
  max-width:500px;
  border-radius:18px;
  padding:25px;
}

.close{
  float:right;
  cursor:pointer;
  font-size:24px;
}

footer{
  text-align:center;
  padding:30px;
  margin-top:30px;
  background:#111;
  color:white;
}
</style>
</head>

<body>

<header>
  <h1>🛍️ AI Bazaar</h1>
  <p>Discover premium digital products for work, business and creativity</p>
</header>

<nav>
  <button class="active" onclick="filterProducts('All',this)">All</button>
  <button onclick="filterProducts('AI',this)">AI</button>
  <button onclick="filterProducts('Business',this)">Business</button>
  <button onclick="filterProducts('Education',this)">Education</button>
  <button onclick="filterProducts('Design',this)">Design</button>
  <button onclick="filterProducts('Marketing',this)">Marketing</button>
  <button onclick="filterProducts('Finance',this)">Finance</button>
  <button onclick="filterProducts('Productivity',this)">Productivity</button>
</nav>

<div class="container">

<input
  id="search"
  class="search"
  type="text"
  placeholder="🔎 Search 200+ digital products..."
  oninput="showProducts()"
>

<div id="products" class="grid"></div>

</div>

<div id="cart" onclick="openCart()">
🛒 Cart: <span id="cartCount">0</span>
</div>

<div id="modal" class="modal">
  <div class="modal-box">
    <span class="close" onclick="closeCart()">×</span>
    <h2>🛒 Your Cart</h2>
    <div id="cartItems"></div>
    <hr>
    <h3>Total: $<span id="total">0.00</span></h3>

    <button class="buy" onclick="checkout()">
      💳 Proceed to Payment
    </button>

    <p style="font-size:13px;color:#687386">
      Payment will be connected to your Paystack account.
    </p>
  </div>
</div>

<footer>
  <p>© 2026 AI Bazaar</p>
  <p>Premium Digital Products Marketplace</p>
</footer>

<script>

const categories = [
  "AI",
  "Business",
  "Education",
  "Design",
  "Marketing",
  "Finance",
  "Productivity"
];

const names = [
  "AI Prompt Pack",
  "Business Plan Template",
  "Social Media Kit",
  "Canva Design Bundle",
  "Digital Marketing Guide",
  "Excel Finance Template",
  "Productivity Planner",
  "ChatGPT Masterclass",
  "Online Course Planner",
  "Instagram Content Pack",
  "YouTube Creator Kit",
  "Ebook Writing Template",
  "Resume Template",
  "CV Design Bundle",
  "Invoice Template",
  "Budget Planner",
  "Small Business Toolkit",
  "Email Marketing Pack",
  "SEO Checklist",
  "Branding Kit",
  "Logo Design Pack",
  "Website Content Pack",
  "Freelancer Toolkit",
  "Business Proposal Pack",
  "Sales Funnel Template",
  "Affiliate Marketing Guide",
  "Digital Product Planner",
  "Online Store Starter Kit",
  "Customer Service Scripts",
  "AI Business Assistant"
];

const icons = [
  "🤖","💼","📱","🎨","📣","💰","📅","🧠","🎓","📸",
  "▶️","📕","📄","✨","🧾","💵","🏢","📧","🔎","🏷️",
  "🎨","🌐","💻","📑","🛒","🚀","📦","🏪","☎️","🤖"
];

let products = [];

for(let i=1;i<=210;i++){

  const name = names[(i-1)%names.length];
  const icon = icons[(i-1)%icons.length];
  const category = categories[(i-1)%categories.length];

  const price = (4.99 + ((i*3.37)%45)).toFixed(2);

  products.push({
    id:i,
    name:name + " #" + i,
    category:category,
    icon:icon,
    price:price,
    rating:(4 + ((i%10)/10)).toFixed(1),
    description:
      "Premium digital resource designed to help you save time, grow your skills and achieve better results."
  });
}

let cart = [];

function showProducts(){

  const search =
    document.getElementById("search").value.toLowerCase();

  const box =
    document.getElementById("products");

  box.innerHTML="";

  const filtered = products.filter(p => {

    const matchesSearch =
      p.name.toLowerCase().includes(search) ||
      p.category.toLowerCase().includes(search);

    const currentCategory =
      document.querySelector("nav button.active").textContent;

    const matchesCategory =
      currentCategory==="All" ||
      p.category===currentCategory;

    return matchesSearch && matchesCategory;
  });

  filtered.forEach(p => {

    box.innerHTML += `
      <div class="card">

        <div class="icon">${p.icon}</div>

        <h3>${p.name}</h3>

        <div>
          <small>${p.category}</small>
        </div>

        <p class="desc">${p.description}</p>

        <div class="rating">
          ⭐ ${p.rating} / 5
        </div>

        <div class="price">
          $${p.price}
        </div>

        <button
          class="buy"
          onclick="addToCart(${p.id})">
          🛒 Add to Cart
        </button>

      </div>
    `;
  });

  if(filtered.length===0){
    box.innerHTML="<h3>No products found.</h3>";
  }
}

function filterProducts(category,button){

  document
    .querySelectorAll("nav button")
    .forEach(b=>b.classList.remove("active"));

  button.classList.add("active");

  showProducts();
}

function addToCart(id){

  const product =
    products.find(p=>p.id===id);

  cart.push(product);

  document.getElementById("cartCount")
    .textContent=cart.length;

  alert(product.name+" added to cart!");
}

function openCart(){

  const modal =
    document.getElementById("modal");

  const items =
    document.getElementById("cartItems");

  items.innerHTML="";

  let total=0;

  if(cart.length===0){
    items.innerHTML="<p>Your cart is empty.</p>";
  }

  cart.forEach((p,index)=>{

    total += Number(p.price);

    items.innerHTML += `
      <p>
        ${p.icon} ${p.name}
        — $${p.price}
        <button onclick="removeItem(${index})">
          Remove
        </button>
      </p>
    `;
  });

  document.getElementById("total")
    .textContent=total.toFixed(2);

  modal.style.display="flex";
}

function removeItem(index){

  cart.splice(index,1);

  document.getElementById("cartCount")
    .textContent=cart.length;

  openCart();
}

function closeCart(){

  document.getElementById("modal")
    .style.display="none";
}


let products=[];
let cart=[];
  /* Create 220 products */






categories.slice(1).forEach((cat,ci)=>{
  names.forEach((name,ni)=>{
    products.push({
      id:ci*11+ni+1,
      name:name+" — "+cat,
      category:cat,
      price:199 + ((ci*73+ni*47)%1800),
      rating:(4+(ni%2)/2).toFixed(1),
      description:"Premium "+cat.toLowerCase()+" digital resource for modern creators and professionals."
    });
  });
});

function showCategories(){
 const nav=document.getElementById("categories");
 nav.innerHTML=categories.map((c,i)=>
 `<button class="${i===0?'active':''}" onclick="filterCategory('${c}',this)">
 ${icons[c]||"🛍️"} ${c}
 </button>`).join("");
}

let currentCategory="All";

function display(list=products){
 const area=document.getElementById("products");

 if(list.length===0){
   area.innerHTML="<h2>No products found.</h2>";
 }else{
   area.innerHTML=list.map(p=>`
   <div class="card">
     <div class="icon">${icons[p.category]||"🛍️"}</div>
     <small>${p.category}</small>
     <h3>${p.name}</h3>
     <div class="rating">★★★★★ ${p.rating}</div>
     <p class="desc">${p.description}</p>
     <div class="price">KSh ${p.price.toLocaleString()}</div>
     <button class="buy" onclick="addToCart(${p.id})">
       🛒 Add to Cart
     </button>
   </div>
   `).join("");
 }

 document.getElementById("count").innerHTML=
 `<p><b>${list.length}</b> digital products available</p>`;
}

function filterCategory(category,button){
 currentCategory=category;

 document.querySelectorAll("nav button")
 .forEach(b=>b.classList.remove("active"));

 button.classList.add("active");

 const search=document.getElementById("search").value.toLowerCase();

 let result=products.filter(p=>
   (category==="All"||p.category===category) &&
   p.name.toLowerCase().includes(search)
 );

 display(result);
}

document.getElementById("search").addEventListener("input",function(){
 const text=this.value.toLowerCase();

 display(products.filter(p=>
   (currentCategory==="All"||p.category===currentCategory) &&
   (p.name.toLowerCase().includes(text) ||
    p.category.toLowerCase().includes(text))
 ));
});

function addToCart(id){
 const product=products.find(p=>p.id===id);
 cart.push(product);
 updateCart();

 alert(product.name+" added to your cart!");
}

function updateCart(){
 document.getElementById("cartCount").textContent=cart.length;

 let total=cart.reduce((sum,p)=>sum+p.price,0);

 document.getElementById("total").textContent=
 total.toLocaleString();

 document.getElementById("cartItems").innerHTML=
 cart.length===0
 ? "<p>Your cart is empty.</p>"
 : cart.map((p,i)=>`
 <div style="padding:10px 0;border-bottom:1px solid #ddd">
 ${p.name}<br>
 <b>KSh ${p.price.toLocaleString()}</b>
 <button onclick="removeItem(${i})">Remove</button>
 </div>
 `).join("");
}

function removeItem(i){
 cart.splice(i,1);
 updateCart();
}

document.getElementById("cart").onclick=()=>{
 document.getElementById("modal").style.display="flex";
 updateCart();
};

function closeModal(){
 document.getElementById("modal").style.display="none";
}

function checkout(){
 if(cart.length===0){
   alert("Your cart is empty.");
   return;
 }

 const email=document.getElementById("email").value;

 if(!email){
   alert("Please enter your email address.");
   return;
 }
const handler = 
  key:'pk_test_YOUR_ACTUAL_KEY_HERE',
  email: email,
  amount: total * 100,
  currency: 'USD',
  callback: function(response) {
    alert("Payment successful! Reference: " + response.reference);
    cart = [];
    updateCart();
    closeModal();
  },
  onClose: function() {
    alert("Payment window closed.");
  }
});

handler.openIframe();
}
 













/* Start website */
showCategories();
display(products);
updateCart();

</script>
</body>
</html>
